<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BD93F9;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#BD93F9;stop-opacity:0.02"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#BD93F9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF79C6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BD93F9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF79C6;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#BD93F9;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#BD93F9;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#BD93F9;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#BD93F9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF79C6;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8BE9FD;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#BD93F9;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#50FA7B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8BE9FD;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect width="520" height="200" rx="16" ry="16"/>
    </clipPath>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#BD93F9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#BD93F9;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orbitGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#BD93F9;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#BD93F9;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="520" height="200" rx="16" ry="16" fill="url(#bgGrad)" clip-path="url(#cardClip)"/>

  <!-- Background glow orb -->
  <ellipse cx="80" cy="100" rx="90" ry="90" fill="url(#pulseGrad)" clip-path="url(#cardClip)">
    <animate attributeName="rx" values="90;110;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="90;110;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Secondary glow orb top-right -->
  <ellipse cx="450" cy="40" rx="70" ry="60" fill="#FF79C6" opacity="0.04" clip-path="url(#cardClip)"/>

  <!-- Glass panel -->
  <rect x="8" y="8" width="504" height="184" rx="12" ry="12" fill="url(#glassGrad)" stroke="#BD93F9" stroke-width="0.6" stroke-opacity="0.25" clip-path="url(#cardClip)"/>

  <!-- Moving light ray -->
  <rect x="-200" y="0" width="200" height="200" fill="url(#rayGrad)" opacity="0.5" clip-path="url(#cardClip)">
    <animateTransform attributeName="transform" type="translate" values="-200,0;720,0;720,0" dur="5s" repeatCount="indefinite" keyTimes="0;0.6;1" calcMode="spline" keySplines="0.4 0 0.6 1;0 0 1 1"/>
  </rect>

  <!-- Top accent line -->
  <rect x="16" y="8" width="488" height="1.5" rx="1" fill="url(#accentGrad)" opacity="0.5"/>

  <!-- Animated scanning line -->
  <rect x="8" y="0" width="504" height="2" rx="1" fill="url(#accentGrad)" opacity="0" clip-path="url(#cardClip)">
    <animate attributeName="y" values="8;192;8" dur="6s" repeatCount