<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0.02"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF4444;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CC3333;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FF6B6B;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="scanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#FF6B6B;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#FF6B6B;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="520" height="200" rx="16" ry="16"/>
    </clipPath>
    <mask id="rayMask">
      <rect x="0" y="0" width="520" height="200" fill="white"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="200" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- Clipped content -->
  <g clip-path="url(#cardClip)">

    <!-- Subtle grid pattern -->
    <g opacity="0.04">
      <line x1="0" y1="40" x2="520" y2="40" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="0" y1="80" x2="520" y2="80" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="0" y1="120" x2="520" y2="120" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="0" y1="160" x2="520" y2="160" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="65" y1="0" x2="65" y2="200" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="130" y1="0" x2="130" y2="200" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="195" y1="0" x2="195" y2="200" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="260" y1="0" x2="260" y2="200" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="325" y1="0" x2="325" y2="200" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="390" y1="0" x2="390" y2="200" stroke="#FF6B6B" stroke-width="0.5"/>
      <line x1="455" y1="0" x2="455" y2="200" stroke="#FF6B6B" stroke-width="0.5"/>
    </g>

    <!-- Animated background glow orb -->
    <circle cx="460" cy="40" r="80" fill="#FF6B6B" opacity="0.04">
      <animate attributeName="opacity" values="0.04;0.09;0.04" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="80;95;80" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Second ambient orb -->
    <circle cx="60" cy="160" r="60" fill="#FF6B6B" opacity="0.03">
      <animate attributeName="opacity" values="0.03;0.07;0.03" dur="5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="60;75;60" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Glassmorphism panel -->
    <rect x="10" y="10" width="500" height="180" rx="12" ry="12" fill="url(#glassGrad)" stroke="#FF6B6B" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Top accent line with animation -->
    <rect x="10" y="10" width="500" height="2" rx="1" fill="url(#accentGrad)" opacity="0.7"/>

    <!-- Animated scan line -->
    <rect x="10" y="0" width="500" height="3" rx="1.5" fill="url(#scanLineGrad)" opacity="0.8">
      <animateTransform