<svg viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B5;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#005f8e;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B5;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#00a0dc;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0077B5;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099e6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0077B5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0077B5;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00c6ff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#0077B5;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077B5;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00c6ff;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="tagGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0077B5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0077B5;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="520" height="280" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect width="520" height="280" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- Clipped content -->
  <g clip-path="url(#cardClip)">

    <!-- Ambient glow top-left -->
    <ellipse cx="80" cy="60" rx="120" ry="80" fill="#0077B5" opacity="0.07" filter="url(#blur8)"/>

    <!-- Ambient glow bottom-right -->
    <ellipse cx="440" cy="220" rx="130" ry="90" fill="#005f8e" opacity="0.08" filter="url(#blur8)"/>

    <!-- Moving light ray -->
    <rect x="-200" y="0" width="280" height="280" fill="url(#rayGrad)" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="-300 0" to="700 0" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    </rect>

    <!-- Glass panel main -->
    <rect x="12" y="12" width="496" height="256" rx="12" ry="12" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

    <!-- Inner glass highlight top -->
    <rect x="12" y="12" width="496" height="60" rx="12" ry="12" fill="white" opacity="0.025"/>

    <!-- Decorative dot grid pattern -->
    <g opacity="0.12">
      <circle cx="400" cy="40" r="1.5" fill="#0077B5"/>
      <circle cx="418" cy="40" r="1.5" fill="#0077B5"/>
      <circle cx="436" cy="40" r="1.5" fill="#0077B5"/>
      <circle cx="454" cy="40" r="1.5" fill="#0077B5"/>
      <circle cx="472" cy="40" r="1.5" fill="#0077B5"/>
      <circle cx="490" cy="40" r="1.5" fill="#0077B5"/>
      <circle cx="400" cy="56" r="1.5" fill="#0077B5"/>
      <circle cx="418" cy="56" r="1.5" fill="#0077B5"/>
      <circle cx="436" cy="56" r="1.5" fill="#0077B5"/>
      <circle cx="454" cy="56" r="1.5" fill="#0077B5"/>
      <circle cx="472" cy="56" r="1.5" fill="#0077B5"/>
      <circle cx="490" cy="56" r="1.5" fill="#0077B5"/>
      <circle cx="400" cy="72" r="1.5" fill="#0077B5"/>
      <circle cx="418" cy="72" r="1.5" fill="#0077B5"/>
      <circle cx="436" cy="72" r="1.5" fill="#0077B5"/>
      <circle cx="454" cy="72" r="1.5" fill="#0077B5"/>
      <circle cx="472" cy="72" r="1.5" fill="#0077B5"/>
      <circle cx="490" cy="72" r="1.5" fill="#0077B5"/>
    </g>

    <!-- LinkedIn-style Icon background circle with pulse -->
    