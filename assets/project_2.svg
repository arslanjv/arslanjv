<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.02" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="techGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD700" flood-opacity="0.5"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="520" height="200" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="520" height="200" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- Clipped inner content -->
  <g clip-path="url(#cardClip)">

    <!-- Glassmorphism inner layer -->
    <rect x="1" y="1" width="518" height="198" rx="15" ry="15" fill="url(#glassGrad)"/>

    <!-- Animated light ray sweep -->
    <rect x="-520" y="0" width="520" height="200" fill="url(#rayGrad)" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="-520 0" to="1040 0" dur="4s" repeatCount="indefinite" begin="0s"/>
    </rect>

    <!-- Subtle top glow bar -->
    <rect x="80" y="0" width="360" height="2" rx="1" fill="#FFD700" opacity="0.15">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Background circuit dots pattern -->
    <circle cx="440" cy="30" r="1.5" fill="#FFD700" opacity="0.15"/>
    <circle cx="460" cy="50" r="1" fill="#FFD700" opacity="0.1"/>
    <circle cx="480" cy="25" r="1.5" fill="#FFD700" opacity="0.12"/>
    <circle cx="500" cy="45" r="1" fill="#FFD700" opacity="0.08"/>
    <circle cx="455" cy="70" r="1.5" fill="#FFD700" opacity="0.1"/>
    <circle cx="490" cy="65" r="1" fill="#FFD700" opacity="0.12"/>
    <line x1="440" y1="30" x2="460" y2="50" stroke="#FFD700" stroke-width="0.5" opacity="0.07"/>
    <line x1="460" y1="50" x2="480" y2="25" stroke="#FFD700" stroke-width="0.5" opacity="0.07"/>
    <line x1="460" y1="50" x2="455" y2="70" stroke="#FFD700" stroke-width="0.5" opacity="0.07"/>
    <line x1="480" y1="25" x2="500" y2="45" stroke="#FFD700" stroke-width="0.5" opacity="0.07"/>
    <line x1="500" y1="45" x2="490" y2="65" stroke="#FFD700" stroke-width="0.5" opacity="0.07"/>

    <!-- Pulsing glow orb top-right -->
    <circle cx="480" cy="40" r="50" fill="#FFD700" opacity="0.03">
      <animate attributeName="r" values="45;60;45" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.06;0.03" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Icon background glow -->
    <circle cx="62" cy="80" r="32" fill="#FFD700" opacity="0.05">
      <animate attributeName="r" values="28;36;28" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.04;0.1;0.04" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Magnifying Glass Icon (forensics) -->
    <g filter="url(#iconShadow)" transform="translate(62,78)">
      <!-- Lens circle -->
      <circle cx="0" cy="-6" r="14" fill="none"