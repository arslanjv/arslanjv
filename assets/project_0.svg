<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39D353;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#39D353;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#39D353;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="cardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39D353;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2EA043;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39D353;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#39D353;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="518" height="198" rx="15" ry="15"/>
    </clipPath>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#39D353;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#39D353;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="518" height="198" rx="15" ry="15" fill="url(#bgGrad)" />

  <!-- Glassmorphism inner layers -->
  <rect x="1" y="1" width="518" height="198" rx="15" ry="15" fill="url(#cardShine)" clip-path="url(#cardClip)" />

  <!-- Animated light ray sweep -->
  <g clip-path="url(#cardClip)">
    <rect x="-200" y="0" width="180" height="200" fill="url(#glowGrad)" opacity="0.4" transform="skewX(-15)">
      <animateTransform attributeName="transform" type="translate" from="-300 0" to="800 0" dur="4s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <!-- Top glowing accent line -->
  <rect x="1" y="1" width="518" height="2" rx="1" fill="url(#glowGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle grid pattern overlay -->
  <g clip-path="url(#cardClip)" opacity="0.03">
    <line x1="0" y1="40" x2="520" y2="40" stroke="#39D353" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="520" y2="80" stroke="#39D353" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="520" y2="120" stroke="#39D353" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="520" y2="160" stroke="#39D353" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="200" stroke="#39D353" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="200" stroke="#39D353" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="200" stroke="#39D353" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="200" stroke="#39D353" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="200" stroke="#39D353" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="200" stroke="#39D353" stroke-width="0.5"/>
  </g>

  <!-- Pulsing radial glow behind icon -->
  <circle cx="72" cy="88" r="48" fill="url(#pulseGrad)">
    <animate attributeName="r" values="40;55;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Box / Phantom Box Icon -->
  <g transform="translate(42, 58)" filter="url(#iconGlow)">
    <!-- Box body -->
    <polygon points="30,8 50,18 50,42 30,52 10,42 10,18" fill="none" stroke="url(#iconGrad)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Box top face -->
    <polygon points="30,8 50,18 30,28 10,18" fill="url(#iconGrad)" opacity="0.25"/>
    <!-- Box middle line -->
    <line x1="10" y1="18" x2="30" y2="28" stroke="#39D353" stroke-width="1.2" opacity="0.7"/>
    <line x1="50" y1="18" x2="