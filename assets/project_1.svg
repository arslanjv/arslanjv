<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0.07" />
      <stop offset="100%" style="stop-color:#58A6FF;stop-opacity:0.02" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#58A6FF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#58A6FF;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F6FEB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#58A6FF;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#58A6FF;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="techPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#1F6FEB;stop-opacity:0.08" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shieldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect width="500" height="200" rx="16" ry="16"/>
    </clipPath>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#58A6FF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1F6FEB;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1F6FEB;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="500" height="200" rx="16" ry="16" fill="url(#bgGrad)" clip-path="url(#cardClip)"/>

  <!-- Ambient orbs -->
  <ellipse cx="80" cy="60" rx="100" ry="80" fill="url(#orb1)" clip-path="url(#cardClip)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="420" cy="160" rx="120" ry="90" fill="url(#orb2)" clip-path="url(#cardClip)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Glassmorphism inner layer -->
  <rect x="10" y="10" width="480" height="180" rx="12" ry="12" fill="url(#glassGrad)" clip-path="url(#cardClip)"/>

  <!-- Animated light ray sweep -->
  <rect x="-200" y="0" width="180" height="200" fill="url(#rayGrad)" opacity="0.7" clip-path="url(#cardClip)">
    <animateTransform attributeName="transform" type="translate" from="-200 0" to="700 0" dur="4s" repeatCount="indefinite" begin="0s"/>
  </rect>

  <!-- Subtle grid lines top-right decorative -->
  <g opacity="0.06" clip-path="url(#cardClip)">
    <line x1="320" y1="0" x2="320" y2="200" stroke="#58A6FF" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="200" stroke="#58A6FF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="200" stroke="#58A6FF" stroke-width="0.5"/>
    <line x1="440" y1="0" x2="440" y2="200" stroke="#58A6FF" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="200" stroke="#58A6FF" stroke-width="0.5"/>
    <line x1="300" y1="40" x2="500" y2="40" stroke="#58A6FF" stroke-width="0.5"/>
    <line x1="300" y1="80" x2="500" y2="80" stroke="#58A6FF" stroke-width="0.5"/>
    <line x1="300" y1="